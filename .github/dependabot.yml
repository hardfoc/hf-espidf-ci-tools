---
# Keeps the SHA-pinned actions in .github/workflows current. Dependabot
# rewrites both the SHA and the trailing `# vX.Y.Z` comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
