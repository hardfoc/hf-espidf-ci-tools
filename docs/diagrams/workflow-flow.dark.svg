<rect x="192.9" y="853.8" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="214.9" y="868.4" font-size="16" fill="#9AA6B5">your repository</text>
