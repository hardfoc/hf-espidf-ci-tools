<text x="56" y="184.4" font-size="20" font-weight="700" fill="#A7F3E6">Your repository</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">esp32-examples-build-ci.yml calls ru-build  /  release.yml (on v* tags) calls the release</text>
<text x="72" y="358.4" font-size="20" font-weight="700" fill="#E8EDF3">generate-matrix</text>
<text x="72" y="389" font-size="17" fill="#D2DAE4">find the project tools</text>
<text x="72" y="413.7" font-size="17" fill="#D2DAE4">app_config.yml to a matrix</text>
<text x="448" y="358.4" font-size="20" font-weight="700" fill="#E8EDF3">build</text>
<text x="448" y="389" font-size="17" fill="#D2DAE4">one job per app, IDF, build type</text>
<text x="448" y="413.7" font-size="17" fill="#D2DAE4">espressif/idf image, build_app.sh</text>
<text x="824" y="358.4" font-size="20" font-weight="700" fill="#E8EDF3">size-report</text>
<text x="824" y="389" font-size="17" fill="#D2DAE4">pull requests only</text>
<text x="824" y="413.7" font-size="17" fill="#D2DAE4">size table comment, optional budget</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">RU-BUILD.YML</text>
<text x="56" y="530.4" font-size="20" font-weight="700" fill="#E8EDF3">hf-espidf-project-tools</text>
<text x="56" y="561" font-size="17" fill="#D2DAE4">generate_matrix.py, build_app.sh, config_loader.sh</text>
<text x="636" y="530.4" font-size="20" font-weight="700" fill="#E8EDF3">fw-&lt;app&gt;-&lt;idf&gt;-&lt;build type&gt;</text>
<text x="636" y="559.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">artifacts, kept 7 days</text>
<text x="56" y="658.4" font-size="20" font-weight="700" fill="#C7CBFF">release (ru-release-with-artifacts.yml)</text>
<text x="56" y="689" font-size="17" fill="#D2DAE4">downloads the fw-* artifacts built for the tagged commit, creates the release, attaches them</text>
<text x="56" y="787.4" font-size="20" font-weight="700" fill="#E8EDF3">GitHub Release</text>
<text x="56" y="818" font-size="17" fill="#D2DAE4">generated notes and the firmware of every matrix entry</text>
