<text x="54" y="868.4" font-size="16" fill="#566070">this repository</text>
<rect x="192.9" y="853.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="214.9" y="868.4" font-size="16" fill="#566070">your repository</text>
<rect x="361.3" y="853.8" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="383.3" y="868.4" font-size="16" fill="#566070">external</text>
</svg>
