<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="904" viewBox="0 0 1200 904" role="img" aria-labelledby="workflow-flow-title workflow-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="workflow-flow-title">From push to release</title>
<desc id="workflow-flow-desc">Flow diagram: a calling repository runs ru-build, whose generate-matrix, build and size-report jobs read app_config.yml through hf-espidf-project-tools, build every app in the espressif/idf image and upload fw-* artifacts; on a version tag ru-release-with-artifacts attaches those artifacts to a GitHub Release.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="903" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">WORKFLOWS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">From push to release</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Two reusable workflows. The build workflow produces the firmware; the release workflow ships it.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#E2E7EE"/>
