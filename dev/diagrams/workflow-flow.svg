<text x="56" y="184.4" font-size="20" font-weight="700" fill="#115E59">Your repository</text>
<text x="56" y="215" font-size="17" fill="#2B3442">esp32-examples-build-ci.yml calls ru-build  /  release.yml (on v* tags) calls the release</text>
<text x="72" y="358.4" font-size="20" font-weight="700" fill="#17202C">generate-matrix</text>
<text x="72" y="389" font-size="17" fill="#2B3442">find the project tools</text>
<text x="72" y="413.7" font-size="17" fill="#2B3442">app_config.yml to a matrix</text>
<text x="448" y="358.4" font-size="20" font-weight="700" fill="#17202C">build</text>
<text x="448" y="389" font-size="17" fill="#2B3442">one job per app, IDF, build type</text>
<text x="448" y="413.7" font-size="17" fill="#2B3442">espressif/idf image, build_app.sh</text>
<text x="824" y="358.4" font-size="20" font-weight="700" fill="#17202C">size-report</text>
<text x="824" y="389" font-size="17" fill="#2B3442">pull requests only</text>
<text x="824" y="413.7" font-size="17" fill="#2B3442">size table comment, optional budget</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">RU-BUILD.YML</text>
<text x="56" y="530.4" font-size="20" font-weight="700" fill="#17202C">hf-espidf-project-tools</text>
<text x="56" y="561" font-size="17" fill="#2B3442">generate_matrix.py, build_app.sh, config_loader.sh</text>
<text x="636" y="530.4" font-size="20" font-weight="700" fill="#17202C">fw-&lt;app&gt;-&lt;idf&gt;-&lt;build type&gt;</text>
<text x="636" y="559.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">artifacts, kept 7 days</text>
<text x="56" y="658.4" font-size="20" font-weight="700" fill="#3730A3">release (ru-release-with-artifacts.yml)</text>
<text x="56" y="689" font-size="17" fill="#2B3442">downloads the fw-* artifacts built for the tagged commit, creates the release, attaches them</text>
<text x="56" y="787.4" font-size="20" font-weight="700" fill="#17202C">GitHub Release</text>
<text x="56" y="818" font-size="17" fill="#2B3442">generated notes and the firmware of every matrix entry</text>
